<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="style.css">
  
<body>
  
  <main>
    <article>
        
      <figure>
        <picture>
          <source media="(min-width: 401px)" srcset="assets/images/illustration-article.svg">
          <source media="(max-width: 400px)" srcset="assets/images/illustration-article-smartphone.svg">
          <img src="assets/images/illustration-article.svg" alt="illustrator-article" />
        </picture>
      </figure>
        
      <p>Learning</p>
      <p>Published 21 Dec 2023</p>
      <h2>HTML & CSS foundations</h2>
      <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
        
      <figure>
        <img src="assets/images/image-avatar.webp" alt="avatar" />
        <figcaption>Greg Hooper</figcaption>
      </figure>
        
    </article>
  </main>
  
  <footer>
    
    <article>
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://www.frontendmentor.io/profile/ROKUROO7">ROKUROO7</a>.
    </article>
    
  </footer>
  
</body>
</html>
